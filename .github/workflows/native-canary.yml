name: Native runtime

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - native/**
      - scripts/build-openxechain.sh
      - scripts/openxechain-newlib-cpp.patch
      - scripts/openxechain-synthxex-image-base.patch
      - scripts/xex_exports.py
      - scripts/tests/test_xex_exports.py
      - .github/workflows/native-canary.yml
  pull_request:
    paths:
      - native/**
      - scripts/build-openxechain.sh
      - scripts/openxechain-newlib-cpp.patch
      - scripts/openxechain-synthxex-image-base.patch
      - scripts/xex_exports.py
      - scripts/tests/test_xex_exports.py
      - .github/workflows/native-canary.yml

permissions:
  contents: read

concurrency:
  # v2 intentionally does not cancel the initial cache-warming run.
  group: native-canary-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build gated AuroraAZ.xex runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      OPENXECHAIN_BUILDSCRIPT_COMMIT: eed1fa65bf9577fd31625764b320a90182ea9ade
      OPENXECHAIN_LLVM_COMMIT: 890b83f6c8259a8899e182a5f7d9cf39c64131cc
      OPENXECHAIN_NEWLIB_COMMIT: f929633c27099d404e9cb5b2739a9c7f9b6afccc
      OPENXECHAIN_SYNTHXEX_COMMIT: 48d1453a55468aa2f8a211db0b20edd594ef5be3
      OPENXECHAIN_XECORELIB_COMMIT: c65d67e071357acade681f04c46ae9719797f239

    steps:
      - name: Check out Aurora A-Z
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Reclaim runner disk space
        run: |
          # These are preinstalled SDK caches on GitHub's disposable runner.
          sudo rm -rf -- \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /opt/hostedtoolcache
          df -h /

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            bash \
            binutils \
            build-essential \
            bzip2 \
            ca-certificates \
            clang \
            cmake \
            findutils \
            gawk \
            git \
            gzip \
            make \
            ninja-build \
            python3 \
            python3-yaml \
            sed \
            tar \
            unzip \
            zip \
            zlib1g-dev \
            zstd

      - name: Build and test portable core
        run: |
          python3 -m unittest scripts/tests/test_xex_exports.py
          cmake -S native -B build/native-host -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/native-host --parallel 2
          ctest --test-dir build/native-host --output-on-failure

      - name: Restore pinned OpenXeChain toolchain
        id: toolchain-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/openxechain-prefix
          key: openxechain-linux-x64-v2-${{ env.OPENXECHAIN_BUILDSCRIPT_COMMIT }}

      - name: Fetch pinned OpenXeChain sources
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        env:
          SOURCE_DIR: ${{ runner.temp }}/openxechain-source
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git clone --filter=blob:none --no-checkout \
            https://github.com/OpenXeChain/buildscript.git "${SOURCE_DIR}"
          git -C "${SOURCE_DIR}" checkout --detach "${OPENXECHAIN_BUILDSCRIPT_COMMIT}"
          git -C "${SOURCE_DIR}" submodule sync --recursive
          git -C "${SOURCE_DIR}" submodule update \
            --init --recursive --depth 1 --jobs 4

          test "$(git -C "${SOURCE_DIR}" rev-parse HEAD)" = \
            "${OPENXECHAIN_BUILDSCRIPT_COMMIT}"
          test "$(git -C "${SOURCE_DIR}/llvm" rev-parse HEAD)" = \
            "${OPENXECHAIN_LLVM_COMMIT}"
          test "$(git -C "${SOURCE_DIR}/newlib" rev-parse HEAD)" = \
            "${OPENXECHAIN_NEWLIB_COMMIT}"
          test "$(git -C "${SOURCE_DIR}/synthxex" rev-parse HEAD)" = \
            "${OPENXECHAIN_SYNTHXEX_COMMIT}"
          test "$(git -C "${SOURCE_DIR}/xecorelib" rev-parse HEAD)" = \
            "${OPENXECHAIN_XECORELIB_COMMIT}"

      - name: Apply pinned Newlib preprocessor fix
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        env:
          SOURCE_DIR: ${{ runner.temp }}/openxechain-source
        run: |
          patch_file="${GITHUB_WORKSPACE}/scripts/openxechain-newlib-cpp.patch"
          git -C "${SOURCE_DIR}" apply --check "${patch_file}"
          git -C "${SOURCE_DIR}" apply "${patch_file}"
          git -C "${SOURCE_DIR}" diff --check
          test "$(git -C "${SOURCE_DIR}" diff --name-only)" = \
            "build-toolchain.sh"
          grep --fixed-strings --quiet \
            'CPP="${PREFIX}/bin/clang -E -nostdlib -I${PWD}/xecorelibtmp/include" \' \
            "${SOURCE_DIR}/build-toolchain.sh"

      - name: Build pinned OpenXeChain toolchain
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        env:
          PREFIX: ${{ runner.temp }}/openxechain-prefix
          SOURCE_DIR: ${{ runner.temp }}/openxechain-source
          PARALLEL: 4
          BUILD_TYPE: Release
          HOST_CC: clang
          HOST_CXX: clang++
        run: |
          cd "${SOURCE_DIR}"
          ./build-toolchain.sh

      - name: Verify OpenXeChain tools
        env:
          OPENXECHAIN_ROOT: ${{ runner.temp }}/openxechain-prefix
        run: |
          test -x "${OPENXECHAIN_ROOT}/bin/clang"
          test -x "${OPENXECHAIN_ROOT}/bin/lld-link"
          test -x "${OPENXECHAIN_ROOT}/bin/synthxex"
          "${OPENXECHAIN_ROOT}/bin/clang" --version

      - name: Save pinned OpenXeChain toolchain
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/openxechain-prefix
          key: openxechain-linux-x64-v2-${{ env.OPENXECHAIN_BUILDSCRIPT_COMMIT }}

      - name: Build patched SynthXEX
        env:
          OPENXECHAIN_ROOT: ${{ runner.temp }}/openxechain-prefix
          SYNTHXEX_SOURCE_DIR: ${{ runner.temp }}/auroraaz-synthxex-source
          SYNTHXEX_BUILD_DIR: ${{ runner.temp }}/auroraaz-synthxex-build
        run: |
          git clone --filter=blob:none --no-checkout \
            https://github.com/OpenXeChain/SynthXEX.git \
            "${SYNTHXEX_SOURCE_DIR}"
          git -C "${SYNTHXEX_SOURCE_DIR}" checkout --detach \
            "${OPENXECHAIN_SYNTHXEX_COMMIT}"
          test "$(git -C "${SYNTHXEX_SOURCE_DIR}" rev-parse HEAD)" = \
            "${OPENXECHAIN_SYNTHXEX_COMMIT}"

          patch_file="${GITHUB_WORKSPACE}/scripts/openxechain-synthxex-image-base.patch"
          git -C "${SYNTHXEX_SOURCE_DIR}" apply --check "${patch_file}"
          git -C "${SYNTHXEX_SOURCE_DIR}" apply "${patch_file}"
          git -C "${SYNTHXEX_SOURCE_DIR}" diff --check

          cmake -S "${SYNTHXEX_SOURCE_DIR}" -B "${SYNTHXEX_BUILD_DIR}" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${OPENXECHAIN_ROOT}"
          cmake --build "${SYNTHXEX_BUILD_DIR}" --parallel 2
          cmake --install "${SYNTHXEX_BUILD_DIR}"
          "${OPENXECHAIN_ROOT}/bin/synthxex" --version

      - name: Cross-build gated Xbox 360 runtime
        env:
          OPENXECHAIN_ROOT: ${{ runner.temp }}/openxechain-prefix
          AURORAAZ_OUTPUT_DIR: ${{ github.workspace }}/build/native-xbox360
        run: bash scripts/build-openxechain.sh

      - name: Validate runtime artifact
        run: |
          output_dir="${GITHUB_WORKSPACE}/build/native-xbox360"
          mapfile -t xex_files < <(find "${output_dir}" -maxdepth 1 -type f -name '*.xex' -print)
          test "${#xex_files[@]}" -eq 1
          test "$(basename "${xex_files[0]}")" = "AuroraAZ.xex"
          test -s "${output_dir}/AuroraAZ.xex"
          test -s "${output_dir}/AuroraAZ.xex.sha256"

          python3 scripts/xex_exports.py validate \
            --pe "${output_dir}/AuroraAZ.dll" \
            --xex "${output_dir}/AuroraAZ.xex" \
            --ordinals 2,3,4,5

          python3 - "${output_dir}/AuroraAZ.xex" <<'PY'
          from pathlib import Path
          import sys

          artifact = Path(sys.argv[1])
          header = artifact.read_bytes()[:4]
          if header != b"XEX2":
              raise SystemExit(f"unexpected XEX header: {header!r}")
          print(f"validated XEX2 header: {artifact} ({artifact.stat().st_size} bytes)")
          PY

          (cd "${output_dir}" && sha256sum --check "AuroraAZ.xex.sha256")

      - name: Upload AuroraAZ.xex runtime
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: AuroraAZ-runtime-${{ github.sha }}
          path: |
            build/native-xbox360/AuroraAZ.xex
            build/native-xbox360/AuroraAZ.xex.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload OpenXeChain failure log
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openxechain-build-log-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/openxechain-source/build.log
            ${{ runner.temp }}/openxechain-source/build/config.log
          if-no-files-found: ignore
          retention-days: 7
